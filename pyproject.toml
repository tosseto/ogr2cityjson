[project]
name = "ogr2cityjson"
version = "0.1.0"
description = "A tool to convert geospatial vector data to CityJSON."
authors = [
    {name = "Stelios Vitalis",email = "steliosvitalis@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
